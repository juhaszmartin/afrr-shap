countries_file: countries.yaml

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reference_dir: data/reference
  # train: before dev_start; dev (early stopping, model selection): dev_start to test_start; test: from test_start
  dev_start: "2025-01-01T00:00:00+00:00"
  test_start: "2026-01-01T00:00:00+00:00"

preprocessing:
  forward_fill_limit:
    fifteen_minute: 3
    hourly: 1
  max_null_ratio: 0.10
  max_dominant_share: 0.99
  gap_warning_days: 1

# Models trained and evaluated for every country. naive (value at t carried forward) is always included.
models: [naive, ridge, lightgbm, nn]

training:  # the neural network
  seeds: 100
  batch_size: 1024
  learning_rate: 0.0001
  epochs: 100
  early_stopping_patience: 5
  huber_delta: 1.0
  hidden_layers: [256, 256]
  deterministic: true

ridge:
  # One alpha per target, picked on dev MAE. Inputs and targets are standardised on train.
  alphas: [0.001, 0.01, 0.1, 1, 10, 100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000]

lightgbm:
  # One booster per target, on the standardised target with the network's Huber loss, early stopping on dev MAE
  params:
    objective: huber
    alpha: 1.0
    metric: l1
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 200
    feature_fraction: 0.5
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    max_bin: 255
    num_threads: 16
    seed: 0
    deterministic: true
    force_row_wise: true
    verbose: -1
  num_boost_round: 2000
  early_stopping_rounds: 100

shap:
  background_samples: 500
  explain_samples: 1000
  sample_seed: 42
  # Split whose rows are explained; countries without rows in it fall back to dev
  split: test
  seeds:
    start: 0
    stop: 5
