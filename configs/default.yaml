countries_file: countries.yaml

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  test_start: "2025-01-01T00:00:00+00:00"

preprocessing:
  forward_fill_limit:
    fifteen_minute: 3
    hourly: 1
  max_null_ratio: 0.10
  max_dominant_share: 0.99
  gap_warning_days: 1

training:
  seeds: 1
  batch_size: 1024
  learning_rate: 0.0001
  epochs: 100
  early_stopping_patience: 5
  huber_delta: 1.0
  hidden_layers: [256, 256]

shap:
  background_samples: 500
  explain_samples: 1000
  sample_seed: 42
  seeds:
    start: 0
    stop: 5
